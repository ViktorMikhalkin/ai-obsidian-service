name: aiobs-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11  # Keeping 3.11 to match CPU env

  # GPU-accelerated ML libraries
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - cudnn
  - faiss-gpu=1.9.0

  # Scientific computing
  - numpy>=1.24,<1.27  # Match CPU constraint
  - scikit-learn>=1.3
  - pandas>=2.0

  # Web framework
  - fastapi>=0.104
  - uvicorn>=0.24
  - pydantic>=2
  - typer>=0.9

  # File handling
  - aiofiles>=23
  - python-multipart>=0.0.6
  - jinja2>=3.1
  - python-dotenv>=1.0
  - pyyaml>=6.0

  # Utilities
  - httpx>=0.25
  - tqdm>=4.65
  - requests>=2.31

  # Development and testing
  - pytest>=8
  - pytest-cov>=4
  - pytest-asyncio>=0.21
  - hypothesis>=6
  - mypy>=1.5
  - ruff>=0.1
  - pre-commit>=3
  - pip>=23

  # Pip packages not available in conda-forge
  - pip:
      - sentence-transformers>=2.2,<3.0
      - rank-bm25>=0.2.2
      - pypdf>=4.0
      - beautifulsoup4>=4.13
      - ebooklib>=0.18
      - python-frontmatter>=1.0.0
      - respx>=0.20.0
      # Type stubs for mypy
      - types-PyYAML
      - types-requests
      - types-tqdm
      - types-aiofiles
