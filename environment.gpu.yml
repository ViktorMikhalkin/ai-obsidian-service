name: aiobs-gpu
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.12

  # GPU-accelerated ML libraries
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - cudnn
  - faiss-gpu>=1.7.0 # TODO: try 1.7.4

  # Scientific computing
  - numpy>=1.24.0,<2.0
  - scikit-learn>=1.3.0
  - pandas>=2.0.0

  # Web framework
  - fastapi>=0.104.0
  - uvicorn>=0.24.0
  - pydantic>=2.0.0
  - typer>=0.9.0

  # File handling
  - aiofiles>=23.0.0
  - python-multipart>=0.0.6
  - jinja2>=3.1.0
  - python-dotenv>=1.0.0
  - pyyaml>=6.0

  # ML libraries
  - transformers>=4.30.0
  - tokenizers>=0.13.0

  # Utilities
  - httpx>=0.25.0
  - tqdm>=4.65.0
  - requests>=2.31.0

  # Development and testing
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pytest-asyncio>=0.21.0
  - mypy>=1.5.0
  - ruff>=0.1.0
  - pre-commit>=3.0.0
  - hypothesis>=6.0.0

  # Package management
  - pip>=23.0.0

  # Pip packages not available in conda-forge
  - pip:
      - sentence-transformers>=2.2.0 # TODO: try 3.0.0
      - rank-bm25>=0.2.2
      - ebooklib>=0.18
      - python-frontmatter>=1.0.0
      - respx>=0.20.0
      # Type stubs for mypy
      - types-PyYAML
      - types-requests
      - types-tqdm
      - types-aiofiles
