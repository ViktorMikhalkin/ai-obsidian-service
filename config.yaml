# Required paths
vault_path: "/data/Obsidian/semantic-vault"
library_paths:
  - "/data/obsidian-test-lib"
#  - "/home/viktor/library"

# Where to store index files
index_dir: ".index"

# Files to include/exclude while scanning
include_globs:
  - "**/*.md"
  - "**/*.pdf"
  - "**/*.epub"
exclude_globs:
  - "**/.trash/**"
  - "**/.obsidian/**"
  - "**/archive/**"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"

# Chunking settings expected by the CLI
chunk:
  target_tokens: 300
  overlap_tokens: 60

# Embedding model (used if embeddings are enabled)
embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

# API server defaults
server:
  host: "127.0.0.1"
  port: 8000

# Embeddings / vector index settings
embeddings:
  # Model from sentence-transformers; small and fast on CPU
  model: "intfloat/multilingual-e5-small"   # or: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cuda"
  dtype: fp32
  batch_size: 128
  # CPU preset (default)
#  device: "cpu"                              # "cpu" is fine; use "cuda" if you have GPU
#  dtype: float32         # fp32 for GPU
#  batch_size: 32 # 128 for GPU
  # GPU preset
#   device: "cuda"
#   dtype: fp32
#   batch_size: 128

  # FAISS index file locations (created during build)
  faiss:
    search_on: cpu         # runtime FAISS search on GPU (optional)
    index_path: "index/faiss.index"
    dim_path: "index/dim.txt"
