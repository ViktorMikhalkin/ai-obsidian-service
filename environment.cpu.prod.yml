name: aiobs-cpu
channels:
  - conda-forge

dependencies:
  # Core
  - python=3.12
  - libstdcxx-ng>=14             # avoids GLIBCXX_3.4.29 issues

  # Scientific/runtime
  - numpy>=1.24,<1.27
  - scikit-learn>=1.3
  - pandas>=2.0

  # Web
  - fastapi>=0.104
  - uvicorn>=0.24
  - pydantic>=2

  # Utilities (runtime)
  - httpx>=0.25
  - tqdm>=4.65
  - requests>=2.31
  - lxml>=4.9.0
  - pyyaml>=6.0
  - aiofiles>=23
  - python-multipart>=0.0.6
  - jinja2>=3.1
  - python-dotenv>=1.0
  - typer>=0.9

  # pip-only
  - pip:
      - faiss-cpu=1.12.0
      - pytorch

      # NLP/ML
      - sentence-transformers>=2.2,<3.0

      # Document processing (runtime only)
      - rank-bm25>=0.2.2
      - pypdf>=4.0
      - beautifulsoup4>=4.13
      - ebooklib>=0.18
      - python-frontmatter>=1.0.0
      - pymupdf>=1.24.0
      - tiktoken>=0.5.0
      - ocrmypdf>=16.11.0
