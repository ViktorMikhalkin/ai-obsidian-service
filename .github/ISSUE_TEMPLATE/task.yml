name: 🧩 Task
description: Tracked work item
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is the expected outcome?
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Steps / checklist
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
  - type: input
    id: owner
    attributes:
      label: Owner
      placeholder: @username
