name: 🐛 Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run command X
        2. Open URL Y
        3. Observe error Z
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Service version
      placeholder: v0.1.0
  - type: input
    id: os
    attributes:
      label: OS / Python
      placeholder: Ubuntu 22.04 / Python 3.11 (conda)
  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      render: shell
