name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed commit types
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            perf
            build
            ci
          # Require scope: must be a single non-empty word
          requireScope: true
          # Subject pattern: must start with lowercase
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter.

            Examples:
              ✅ feat(api): add health check endpoint
              ✅ fix(myfeature): resolve bug
              ✅ chore(anything): update dependencies
              ❌ feat: missing scope
              ❌ feat(api): Add endpoint (uppercase subject)
