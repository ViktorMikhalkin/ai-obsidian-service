name: PR Title Check

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            build
            perf
          scopes: |
            index
            parser
            faiss
            rag
            repo
            api
            cli
            ci
            packaging
            docs
          requireScope: true
          subjectPattern: '^[^\s].+$'
          subjectPatternError: 'Subject must not be empty and must not start with whitespace.'
