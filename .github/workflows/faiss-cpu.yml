name: CI (faiss-cpu, py312)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/faiss-cpu.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  faiss_cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps (faiss-cpu + ST)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install faiss-cpu sentence-transformers
      - name: Tests (integration_cpu/faiss markers)
        env:
          VECTOR_STORE_BACKEND: faiss
        run: python -m pytest -v --tb=short --strict-markers -m "integration_cpu or faiss"
