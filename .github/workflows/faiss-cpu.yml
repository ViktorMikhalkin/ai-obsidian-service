name: CI (integration-cpu, py312)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/faiss-cpu.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  integration_cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pydantic>=2" faiss-cpu "sentence-transformers>=2.2" rank-bm25 pymupdf pypdf ebooklib python-frontmatter

      - name: Type check (mypy)
        run: python -m mypy src tests

      - name: Tests (integration_cpu + faiss)
        run: python -m pytest -v --tb=short --strict-markers -m "integration_cpu or faiss"
