name: CI (e2e, py312)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pydantic>=2" faiss-cpu "sentence-transformers>=2.2" rank-bm25 pymupdf pypdf ebooklib python-frontmatter

      - name: Run e2e tests
        env:
          VECTOR_STORE_BACKEND: memory
        run: python -m pytest -v --tb=short --strict-markers -m "e2e"
