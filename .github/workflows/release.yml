name: Release

on:
  workflow_run:
    workflows:
      - "PR Title Check"
      - "Quality & Unit Tests"
      - "Integration Tests (FAISS CPU)"
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
