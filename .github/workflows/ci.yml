name: CI (unit, py312)

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install mypy plugin deps
        run: |
          python -m pip install "pydantic>=2" types-PyYAML

      - name: Lint (ruff)
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy src tests

      - name: Tests (unit only)
        env:
          VECTOR_STORE_BACKEND: memory
        run: python -m pytest -v --tb=short --strict-markers -m "not integration_cpu and not integration_gpu and not e2e and not faiss"
