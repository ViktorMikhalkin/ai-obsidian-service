name: End-to-End Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Full System with All Parsers
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conda environment
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true

      - name: Install project in editable mode
        run: pip install -e "."

      - name: Verify full stack
        run: |
          python -c "import pymupdf; print('PyMuPDF:', pymupdf.__version__)"
          python -c "import ebooklib; print('ebooklib:', ebooklib.__version__)"
          python -c "import sentence_transformers; print('sentence-transformers:', sentence_transformers.__version__)"

      - name: End-to-end tests
        run: make test-e2e
