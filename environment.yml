name: aiobs
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - pip
  # Native libs for parsers
  - libxml2
  - libxslt
  - poppler
  # Vector search + embeddings
  - faiss-cpu=1.12.0
  - pytorch=2.*=cpu*
  - torchvision=0.*=cpu*
  - cpuonly
  # Everything else via pip (pinned to this project)
  - pip:
      - fastapi==0.112.2
      - uvicorn==0.30.6
      - pydantic==2.8.2
      - pyyaml==6.0.2
      - rank-bm25==0.2.2
      - python-frontmatter==1.1.0
      - markdown-it-py==3.0.0
      - regex==2024.7.24
      - numpy==1.26.4
      - scikit-learn==1.5.1
      - typer==0.12.3
      - ebooklib==0.18
      - lxml==5.3.0
      - chardet==5.2.0
      - sentence-transformers==3.0.1
      - tqdm==4.66.4
      - ollama>=0.3.0
      # dev
      - pytest==8.2.2
      - requests==2.32.3
      - pre-commit==4.3.0
      - mypy==1.18.1
      - ruff==0.13.0
      - types-PyYAML
