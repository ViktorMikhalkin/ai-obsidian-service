# Pure conda approach - no dependencies in pyproject.toml
# All dependencies managed via environment.gpu.yml

[tool.ccpolicy]
types = ["feat", "fix", "docs", "style", "refactor", "test", "chore", "ci", "build", "perf"]
scopes = ["index", "parser", "faiss", "rag", "repo", "api", "cli", "ci", "packaging", "docs", "core", "main"]
enforce_scope = true
allow_scopeless = false
header_max_length = 72
forbid_trailing_period = true
subject_min_length = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
allow_subclassing_any = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
# Fix duplicate module issue
exclude = [
    "^build/",
    "^dist/",
    "^\\..*"
]
# Only check source files
files = ["src/"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-v --tb=short --strict-markers -m 'not integration_cpu and not integration_gpu and not e2e and not faiss'"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "unit: fast tests with fakes/mocks (default in CI)",
    "integration_cpu: real faiss-cpu + sentence-transformers (no mocks)",
    "integration_gpu: real faiss-gpu + sentence-transformers + CUDA (no mocks)",
    "e2e: end-to-end tests over a mini corpus",
    "faiss: tests requiring FAISS & sentence-transformers"
]

filterwarnings = [
    "error::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]