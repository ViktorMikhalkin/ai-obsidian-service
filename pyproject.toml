[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-obsidian-service"
description = "AI↔Obsidian service"
readme = "README.md"
requires-python = ">=3.10"
# Release Please bumps src/ai_obsidian_service/__init__.py; read version dynamically:
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov",
    "hypothesis",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ai_obsidian_service.__version__" }

# -------------------------
# Tooling
# -------------------------

[tool.ccpolicy]
types = ["feat", "fix", "docs", "style", "refactor", "test", "chore", "ci", "build", "perf"]
scopes = ["index", "parser", "faiss", "rag", "repo", "api", "cli", "ci", "packaging", "docs", "core", "main"]
enforce_scope = true
allow_scopeless = false
header_max_length = 72
forbid_trailing_period = true
subject_min_length = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
allow_subclassing_any = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "^build/",
    "^dist/",
    "^\\..*"
]
files = ["src/", "tests/"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP"]
ignore = ["E501","B008","C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
# Unit profile by default (matches Makefile "test" target)
addopts = "-v --tb=short --strict-markers -m 'not integration_cpu and not integration_gpu and not e2e and not faiss'"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "unit: fast tests with fakes/mocks (default in CI)",
    "integration_cpu: real faiss-cpu + sentence-transformers (no mocks)",
    "integration_gpu: real faiss-gpu + sentence-transformers + CUDA (no mocks)",
    "e2e: end-to-end tests over a mini corpus",
    "faiss: tests requiring FAISS & sentence-transformers"
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
